name: build-linux

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libglib2.0-dev

      - name: Download FFmpeg (Linux)
        run: |
          mkdir -p ffmpeg/linux
          if [ ! -f ffmpeg/linux/ffmpeg ]; then
            curl -L -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-*-amd64-static/ffmpeg ffmpeg/linux/ffmpeg
            cp /tmp/ffmpeg-*-amd64-static/ffprobe ffmpeg/linux/ffprobe || true
            chmod +x ffmpeg/linux/ffmpeg ffmpeg/linux/ffprobe
          fi
          ls -la ffmpeg/linux

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Build (Tauri)
        run: npx tauri build --verbose

      - name: Collect artifacts
        run: |
          mkdir -p dist
          APPIMG=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n 1 || true)
          if [ -n "$APPIMG" ]; then cp "$APPIMG" dist/OldConverter-Linux-x86_64.AppImage; fi
          BIN=src-tauri/target/release/old-converter
          if [ -f "$BIN" ]; then
            tar -czf dist/OldConverter-Linux-x86_64.tar.gz -C src-tauri/target/release old-converter \
              -C "$GITHUB_WORKSPACE" ffmpeg/linux presets README.md LICENSE || true
          fi
          ls -la dist

      - uses: actions/upload-artifact@v6
        with:
          name: OldConverter-Linux-x86_64
          path: dist/*
          if-no-files-found: error
